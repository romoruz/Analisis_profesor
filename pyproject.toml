[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "analisis-profesor"
version = "0.1.0"
description = "Kit + protocolo para que una IA de chat analice el material de un profesor y genere simulacros y guía del parcial."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # Núcleo mínimo: lo que hay en los sandboxes de ChatGPT / Claude / Gemini. Nada más.
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Aceleradores opcionales: el kit funciona sin ellos (con respaldo en Python puro)
completo = ["scikit-learn>=1.3", "sympy>=1.12", "pymupdf>=1.24", "datasketch>=1.6"]
# Embeddings y tópicos: solo para uso local (Antigravity / Claude Code), nunca obligatorio
nlp = ["sentence-transformers>=3.0", "bertopic>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
ap = "analisis_profesor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/analisis_profesor"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "real: pruebas con el material real de SD-II en entrada/estudio_parciales.zip (se saltan si no existe)",
]
