name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  completo:
    name: "Completo (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar dev,completo
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,completo]"
      - name: Verificar estilo con ruff
        run: ruff check src tests ap.py
      - name: Ejecutar pruebas con pytest
        run: pytest

  sandbox-minimo:
    name: "Sandbox mínimo (numpy y scipy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar paquete base (solo numpy y scipy)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Verificar diagnóstico sin librerías opcionales
        run: |
          python -c '
          import json, subprocess, sys
          r = subprocess.run([sys.executable, "ap.py", "diagnostico"], capture_output=True, text=True, check=True)
          print(r.stdout)
          d = json.loads(r.stdout.split("\n\n")[0])
          assert d["modo"] == "completo", d
          assert d["librerias"]["numpy"] and d["librerias"]["scipy"], d
          for opc in ("sklearn", "sympy", "fitz", "pypdf", "pdfplumber"):
              assert not d["librerias"][opc], f"{opc} no debería estar instalado"
          '
      - name: Ejecutar pruebas con solo numpy y scipy
        run: |
          python -m pip install pytest
          pytest

  python-puro:
    name: "Python puro (python -I)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ejecutar ap.py diagnostico con python -I
        run: |
          out="$(python -I ap.py diagnostico)"
          echo "$out"
          python -I -c '
          import json, sys
          d = json.loads(sys.argv[1].split("\n\n")[0])
          assert d["modo"] == "reducido", d
          assert not any(d["librerias"].values()), d
          ' "$out"
      - name: Ejecutar ap.py items con python -I
        run: |
          mkdir -p trabajo/ci_puro/02_texto
          if [ -d tests/fixtures/mini/02_texto ]; then
            cp -r tests/fixtures/mini/* trabajo/ci_puro/
          else
            printf '# Curso CI - P1 - 2026-03-01\ntipo: examen\nduracion_min: 90\n\n## Pregunta 1 (5 puntos)\nEnunciado.\n' > trabajo/ci_puro/02_texto/examen.md
          fi
          set +e
          out="$(python -I ap.py items ci_puro)"
          rc=$?
          set -e
          echo "$out"
          pendiente="$(python -I -c 'import sys; sys.path.insert(0, "src"); from analisis_profesor.cli import PENDIENTES; print("1" if "items" in PENDIENTES else "0")')"
          if [ "$pendiente" = "1" ]; then
            test "$rc" -eq 2
            echo "$out" | grep -q "PENDIENTE:"
          else
            test "$rc" -eq 0
            test -s trabajo/ci_puro/03_items.jsonl
          fi
          rm -rf trabajo/ci_puro
