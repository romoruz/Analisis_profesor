# Configuración de una materia. Copia materias/_plantilla a materias/<id> (o usa `ap nueva <id>`).
id: plantilla
nombre: "Nombre de la materia"
clave: "MAT-00000"
profesor: "Apellido"
semestre: "2026-II"
idioma: es

# Parcial objetivo y alcance (temas que entran). Si el profe anuncia temario, ponlo aquí.
objetivo:
  parcial: P2
  fecha: null
  temas: []              # ["4.3", "4.4", ...]
  fuera_de_alcance: []

# Arquetipos (tipos de pregunta). Fase 3 propone; tú apruebas. clave: [descripción, minutos]
arquetipos: {}

# Rasgos de dificultad de la materia: nombre: [peso, valor_base, máximo, descripción]
rasgos:
  entregables:  [0.6, 1, 5, "cuántas cosas pide"]
  parametro:    [1.2, 0, 2, "0 nada, 1 un valor crítico, 2 varios regímenes"]
  tecnica:      [1.2, 0, 3, "0 receta, 1 truco, 2 construcción, 3 argumento global"]
  demostracion: [1.0, 0, 2, "1 aplicar teorema, 2 demostración abstracta"]
  algebra:      [0.6, 0, 2, "carga de cuentas"]
  casos:        [0.4, 1, 4, "regímenes/casos"]

# Formato de examen observado
formato:
  preguntas: {4: 1.0}    # número de preguntas: peso
  minutos: [75, 100]     # ventana de duración estimada
  puntos_por_pregunta: null

# Verificador de soluciones para el banco: sympy | numerico | manual
verificador: sympy
